<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture fixture</title>
    <style>
        body { margin: 0; font: 16px/1.5 sans-serif; }
        /* Deliberately taller than any emulated viewport, so a capture that
           only grabbed the visible area is detectable. */
        .block { height: 1200px; padding: 24px; }
        .a { background: #eef2ff; }
        .b { background: #fef3c7; }
        .c { background: #dcfce7; }
    </style>
</head>
<body>
    <div class="block a"><h1>Block A</h1></div>
    <div class="block b"><h1>Block B</h1></div>
    <div class="block c"><h1>Block C</h1></div>
</body>
</html>
